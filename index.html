<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>С ДНЁМ РОЖДЕНИЯ!</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0d0d1a;
            color: #fff;
            font-family: 'Press Start 2P', cursive;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(255, 0, 85, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 0, 85, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: -1;
        }

        .bg-heart {
            position: absolute;
            background-color: #ff0055;
            box-shadow: 0 0 10px #ff0055;
            opacity: 0.6;
            animation: fall linear infinite;
            z-index: 0;
        }

        @keyframes fall {
            0% { transform: translateY(-100px) rotate(0deg); }
            100% { transform: translateY(105vh) rotate(360deg); }
        }

        .main-heart-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            z-index: 1;
        }

        .pixel-heart {
            width: 70vw;
            max-width: 500px;
            height: auto;
            fill: #ff0055;
            filter: drop-shadow(0 0 20px rgba(255, 0, 85, 0.8));
            animation: pixel-beat 1s infinite steps(2); 
        }

        @keyframes pixel-beat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        .greeting {
            width: 100%;
            background: rgba(13, 13, 26, 0.9);
            border-top: 4px solid #ff0055;
            padding: 25px 15px;
            text-align: center;
            z-index: 1;
            box-shadow: 0 -5px 30px rgba(255, 0, 85, 0.2);
        }

        .greeting h1 {
            color: #00ffcc;
            font-size: 1.2rem;
            margin-bottom: 15px;
            text-shadow: 3px 3px 0 #000;
            line-height: 1.5;
        }

        .greeting p {
            color: #fff;
            font-size: 0.8rem;
            line-height: 1.8;
            text-shadow: 2px 2px 0 #000;
        }

        @media (max-width: 480px) {
            .greeting h1 { font-size: 0.9rem; }
            .greeting p { font-size: 0.65rem; }
            .pixel-heart { width: 80vw; }
        }
    </style>
</head>
<body>

    <div class="main-heart-container">
        <svg class="pixel-heart" viewBox="0 0 16 14" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 2h2v2h1v2h2V4h1V2h2v2h2v4h-1v2h-1v2h-1v2h-1v2H9v-2H8v-2H7v-2H6V8H5V6H4V2z" />
            <path d="M1 4h3v2h1v2h1v2h1v2h1v2h2v-2h1v-2h1v-2h1V8h1V6h1V4h-3v2h-1v2h-1v2h-1v2h-1v-2h-1V8H7V6H6V4H1z" />
            <path d="M4 2h2v2h1v2h1V6h1V4h1V2h2v2h2v4h-1v2h-1v2h-1v2h-1v2H9v-2H8v-2H7v-2H6V8H5V6H4V4H3V2h1z" />
            <path d="M2 2h2v2h1v2h1v2h1v2h1v2h2v-2h1v-2h1V8h1V6h1V4h1V2h-2v2h-1v2h-1v2h-1v2h-1V8H9V6H8V4H7V2H2z" />
        </svg>
    </div>

    <div class="greeting">
        <h1>ТЫ - САМАЯ ЛУЧШАЯ!</h1>
        <p>С ДНЁМ РОЖДЕНИЯ, ЛЮБИМКА ❤️</p>
    </div>

    <script>
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('bg-heart');
            const size = Math.random() * 10 + 4;
            heart.style.width = `${size}px`;
            heart.style.height = `${size}px`;
            heart.style.left = `${Math.random() * 100}vw`;
            const duration = Math.random() * 4 + 3;
            heart.style.animationDuration = `${duration}s`;
            heart.style.animationDelay = `-${Math.random() * 5}s`;
            document.body.appendChild(heart);
            setTimeout(() => {
                heart.remove();
            }, duration * 1000);
        }
        setInterval(createHeart, 150);
    </script>
</body>
</html>
