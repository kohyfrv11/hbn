<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>С Днём Рождения, Настенька!</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            background: linear-gradient(135deg, #ffe6f2 0%, #ffcdd2 50%, #f8bbd0 100%);
            position: relative;
        }
        .flower {
            position: absolute;
            font-size: 2rem;
            opacity: 0.4;
            animation: float 6s ease-in-out infinite;
            user-select: none;
        }
        .flower:nth-child(1) { top: 10%; left: 10%; animation-delay: 0s; }
        .flower:nth-child(2) { top: 20%; right: 15%; animation-delay: 1.5s; font-size: 3rem; }
        .flower:nth-child(3) { bottom: 15%; left: 20%; animation-delay: 3s; font-size: 2.5rem; }
        .flower:nth-child(4) { bottom: 25%; right: 10%; animation-delay: 4.5s; }
        .flower:nth-child(5) { top: 50%; left: 5%; animation-delay: 2s; }
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(10deg); }
        }
        .container {
            text-align: center;
            z-index: 10;
            padding: 20px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 30px;
            backdrop-filter: blur(5px);
            box-shadow: 0 10px 30px rgba(255, 51, 102, 0.2);
            max-width: 90%;
        }
        .heart {
            position: relative;
            width: 120px;
            height: 110px;
            margin: 0 auto 20px;
            animation: heartbeat 1.2s infinite ease-in-out;
        }
        .heart::before,
        .heart::after {
            content: '';
            position: absolute;
            top: 0;
            width: 60px;
            height: 95px;
            background: #ff1744;
            border-radius: 60px 60px 0 0;
        }
        .heart::before {
            left: 0;
            transform: rotate(-45deg);
            transform-origin: 100% 100%;
        }
        .heart::after {
            right: 0;
            transform: rotate(45deg);
            transform-origin: 0 100%;
        }
        @keyframes heartbeat {
            0% { transform: scale(1); }
            14% { transform: scale(1.3); }
            28% { transform: scale(1); }
            42% { transform: scale(1.3); }
            70% { transform: scale(1); }
        }
        h1 {
            color: #d81b60;
            font-size: 2rem;
            margin-bottom: 15px;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.8);
        }
        p {
            color: #880e4f;
            font-size: 1.1rem;
            line-height: 1.6;
            font-weight: 500;
        }
        @media (max-width: 480px) {
            .heart { width: 90px; height: 80px; }
            .heart::before, .heart::after { width: 45px; height: 70px; }
            h1 { font-size: 1.6rem; }
            p { font-size: 1rem; }
            .flower { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <div class="flower">🌸</div>
    <div class="flower">🌺</div>
    <div class="flower">🌷</div>
    <div class="flower">🌼</div>
    <div class="flower">🌻</div>

    <div class="container">
        <div class="heart"></div>
        <h1>С Днём Рождения, Настенька! 🎉</h1>
        <p>
            Пусть у тебя всё будет хорошо!!! <br>
            Море счастья, цветов и улыбок!<br>
            Ты - самая лучшая! ❤️
        </p>
    </div>
</body>
</html>
