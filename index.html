<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>С ДНЁМ РОЖДЕНИЯ!</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0d0d1a;
            color: #fff;
            font-family: 'Press Start 2P', cursive;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(255, 0, 85, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 0, 85, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: -1;
        }

        .falling-item {
            position: absolute;
            top: -30px;
            animation: fall linear infinite;
            z-index: 0;
            opacity: 0.8;
        }

        @keyframes fall {
            0% { transform: translateY(0) rotate(0deg); }
            100% { transform: translateY(105vh) rotate(360deg); }
        }

        .main-heart-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            z-index: 1;
        }

        .pixel-heart {
            width: 75vw;
            max-width: 550px;
            height: auto;
            filter: drop-shadow(0 0 20px rgba(255, 0, 85, 0.8));
            animation: pixel-beat 1s infinite steps(2); 
        }

        @keyframes pixel-beat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .greeting {
            width: 100%;
            background: rgba(13, 13, 26, 0.9);
            border-top: 4px solid #ff0055;
            padding: 25px 15px;
            text-align: center;
            z-index: 1;
            box-shadow: 0 -5px 30px rgba(255, 0, 85, 0.2);
        }

        .greeting h1 {
            color: #00ffcc;
            font-size: 1.2rem;
            margin-bottom: 15px;
            text-shadow: 3px 3px 0 #000;
            line-height: 1.5;
        }

        .greeting p {
            color: #fff;
            font-size: 0.8rem;
            line-height: 1.8;
            text-shadow: 2px 2px 0 #000;
        }

        @media (max-width: 480px) {
            .greeting h1 { font-size: 0.9rem; }
            .greeting p { font-size: 0.65rem; }
            .pixel-heart { width: 85vw; }
        }
    </style>
</head>
<body>

    <div class="main-heart-container">
        <svg class="pixel-heart" viewBox="0 0 17 15" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
            <rect x="3" y="2" width="3" height="2" fill="#ff0055"/>
            <rect x="11" y="2" width="3" height="2" fill="#ff0055"/>
            <rect x="2" y="4" width="5" height="2" fill="#ff0055"/>
            <rect x="10" y="4" width="5" height="2" fill="#ff0055"/>
            <rect x="1" y="6" width="15" height="3" fill="#ff0055"/>
            <rect x="2" y="9" width="13" height="2" fill="#ff0055"/>
            <rect x="4" y="11" width="9" height="2" fill="#ff0055"/>
            <rect x="6" y="13" width="5" height="2" fill="#ff0055"/>
        </svg>
    </div>

    <div class="greeting">
        <h1>ТЫ - САМАЯ ЛУЧШАЯ!</h1>
        <p>С ДНЁМ РОЖДЕНИЯ, ЛЮБИМКА ❤️</p>
    </div>

    <script>
        function createFallingItem() {
            const el = document.createElement('div');
            el.classList.add('falling-item');
            
            const isHeart = Math.random() > 0.4;
            const size = Math.random() * 15 + 10;
            
            el.style.width = `${size}px`;
            el.style.height = `${size}px`;
            el.style.left = `${Math.random() * 100}vw`;
            
            if (isHeart) {
                el.innerHTML = `<svg viewBox="0 0 17 15" width="100%" height="100%" shape-rendering="crispEdges"><rect x="3" y="2" width="3" height="2" fill="#ff0055"/><rect x="11" y="2" width="3" height="2" fill="#ff0055"/><rect x="2" y="4" width="5" height="2" fill="#ff0055"/><rect x="10" y="4" width="5" height="2" fill="#ff0055"/><rect x="1" y="6" width="15" height="3" fill="#ff0055"/><rect x="2" y="9" width="13" height="2" fill="#ff0055"/><rect x="4" y="11" width="9" height="2" fill="#ff0055"/><rect x="6" y="13" width="5" height="2" fill="#ff0055"/></svg>`;
            } else {
                el.innerHTML = `<svg viewBox="0 0 10 10" width="100%" height="100%" shape-rendering="crispEdges"><rect x="3" y="1" width="4" height="8" fill="#00ff00"/><rect x="1" y="3" width="8" height="4" fill="#00ff00"/><rect x="4" y="4" width="2" height="2" fill="#ffff00"/></svg>`;
            }
            
            const duration = Math.random() * 4 + 4;
            el.style.animationDuration = `${duration}s`;
            el.style.animationDelay = `-${Math.random() * 5}s`;
            
            document.body.appendChild(el);
            
            setTimeout(() => {
                el.remove();
            }, duration * 1000);
        }
        setInterval(createFallingItem, 200);
    </script>
</body>
</html>
